<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission: Indigestible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;700&family=Titan+One&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-shift cleaning-crew HQ. Navy shell, sky-blue work floor, sponge-yellow and broom-orange for the two fiber teams. */
:root{
  --ink:#12263f; --ink2:#3d5370; --paper:#eef6fc; --card:#ffffff; --line:#c9dcec;
  --carolina:#4b9cd3; --sky:#bfe1f7; --sponge:#f7c531; --broom:#f0803c; --gut:#f6b3a8; --crew:#4f9e45;
  --good:#1f8a4c; --goodbg:#dff5e6; --bad:#c93a3a; --badbg:#fde4e1;
  --display:"Titan One","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  --fs:17px; color-scheme:light;
}
html.sz1{--fs:19px} html.sz2{--fs:22px}
html.dys{--body:"Lexend","Verdana",sans-serif;--display:"Lexend","Verdana",sans-serif}
html.dys body{letter-spacing:.03em;word-spacing:.08em;line-height:1.7}
html.hc{--ink:#000;--ink2:#1a1a1a;--paper:#fff;--card:#fff;--line:#000;--carolina:#005a9c;--sky:#fff;--good:#006b2d;--bad:#a80000;--goodbg:#fff;--badbg:#fff}
html.hc .chip,html.hc .bin,html.hc .mcard,html.hc .btn,html.hc .panel{border-width:3px!important;border-color:#000!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.5 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
html.dys h1,html.dys h2,html.dys h3{font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid #ff8a00;outline-offset:3px;border-radius:6px}
img{max-width:100%}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
svg{display:block}

/* ---------- top bar ---------- */
#bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 18px;flex-wrap:wrap}
#bar .logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:2px 6px}
#bar .logo b{font-family:var(--display);font-weight:400;font-size:1.25rem;letter-spacing:.02em}
#bar .logo b i{font-style:normal;color:var(--sponge)}
#bar .sp{flex:1}
.pill{background:#1e3a5c;border-radius:99px;padding:5px 14px;font-size:.9rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill b{color:var(--sponge);font-variant-numeric:tabular-nums}
.ib{background:#1e3a5c;border:2px solid transparent;color:#fff;border-radius:12px;padding:7px 12px;display:flex;align-items:center;gap:7px;font-size:.9rem}
.ib:hover{border-color:var(--sky)} .ib svg{width:20px;height:20px}
html.hc #bar{background:#000}

#bar,main,#a11y{zoom:var(--z,1)}
main{max-width:1280px;margin:0 auto;padding:18px 18px 60px}
.screen{display:none} .screen.on{display:block}

/* ---------- buttons, cards ---------- */
.btn{background:var(--carolina);color:#fff;border:0;border-bottom:5px solid #2f77a8;border-radius:16px;padding:12px 24px;font-family:var(--display);font-size:1.15rem;letter-spacing:.03em;transition:transform .12s}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.yellow{background:var(--sponge);color:var(--ink);border-bottom-color:#c9990e}
.btn.orange{background:var(--broom);border-bottom-color:#b9571c}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);border-bottom-width:5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{font-size:.95rem;padding:8px 16px;border-radius:12px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
.row>*{min-width:0}
.center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- welcome ---------- */
#welcome{position:relative}
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:540px;background:#5b2330 center/cover;display:flex;align-items:flex-end;box-shadow:0 14px 0 var(--ink)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,38,63,.1) 0%,rgba(18,38,63,.25) 40%,rgba(18,38,63,.93) 82%)}
.hero-in{position:relative;z-index:2;padding:28px 34px 30px;width:100%;color:#fff;display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);text-shadow:0 5px 0 var(--ink);line-height:.95}
.hero h1 span{display:block;color:var(--sponge)}
.hero h1 small{display:block;font-family:var(--body);font-weight:700;font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;text-shadow:none;margin-bottom:10px;color:var(--sky)}
.hero .tag{max-width:46ch;margin-top:12px;font-size:1.05rem}
.clock{background:#fff;color:var(--ink);border-radius:20px;padding:18px;width:320px;max-width:100%;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink)}
.clock h2{font-size:1.25rem;margin-bottom:4px}
.clock label{font-size:.9rem;color:var(--ink2);display:block;margin-bottom:8px}
.clock input{width:100%;font:inherit;font-size:1.15rem;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;margin-bottom:12px;background:#fffbe9}
.clock .btn{width:100%}
.hero .floaty{position:absolute;z-index:1;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.08) 60%);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(40px) scale(.6);opacity:0}15%{opacity:.9}to{transform:translateY(-560px) scale(1.15);opacity:0}}
.hero .duo{position:absolute;z-index:2;top:22px;right:26px;display:flex;gap:6px}
.hero .duo img{width:150px;height:150px;object-fit:contain;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(18,38,63,.55))}
.hero .duo img:last-child{animation-delay:-1.2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(5deg)}}
/* garage door entrance */
#door{position:fixed;inset:0;z-index:80;display:none;pointer-events:none}
#door.go{display:block}
#door .slats{position:absolute;inset:0;background:#1b3554 url(img/door.webp) center/cover no-repeat;text-shadow:0 3px 0 #0b1a2c,0 0 18px #0b1a2c;transform:translateY(-100%);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center}
#door.go .slats{animation:door 2.6s cubic-bezier(.6,0,.3,1) forwards}
@keyframes door{0%{transform:translateY(-100%)}28%{transform:translateY(0)}32%{transform:translateY(-1.5%)}36%,70%{transform:translateY(0)}100%{transform:translateY(-103%)}}
#door h2{font-size:clamp(2rem,6vw,4rem);color:var(--sponge);text-shadow:0 4px 0 #0b1a2c}
#door p{font-size:1.3rem;margin-top:10px}
#door .stamp{text-shadow:none;background:rgba(11,26,44,.7);margin-top:18px;border:5px solid #7be08f;color:#7be08f;font-family:var(--display);font-size:1.6rem;padding:6px 20px;border-radius:10px;transform:rotate(-7deg) scale(0);animation:stamp .35s 1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{transform:rotate(-7deg) scale(1)}}

/* ---------- HQ ---------- */
.hq-top{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;margin-bottom:18px;min-height:250px;padding:22px 26px;border:3px solid var(--ink);border-radius:24px;background:#12263f right center/cover no-repeat;color:#fff}
.hq-top::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,38,63,.94) 0%,rgba(18,38,63,.82) 30%,rgba(18,38,63,0) 58%)}
.hq-top>*{position:relative}
.hq-top h1{font-size:2.6rem;color:var(--sponge)}
.hq-top .who{max-width:40ch}
.hq-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rank{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 16px;border:2px solid #31517a}
.rank svg{width:52px;height:52px}
.rank b{font-family:var(--display);font-weight:400;font-size:1.2rem;color:var(--sponge);display:block}
.meter{height:10px;background:#31517a;border-radius:9px;overflow:hidden;width:170px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--sponge);border-radius:9px;transition:width .6s}
.floor{border-radius:24px;padding:18px;margin-bottom:18px;border:3px solid var(--ink);background:var(--card);position:relative}
.floor.l1{background:#e3f2fc} .floor.l2{background:#fff6d6} .floor.l3{background:#ffe8da} .floor.l0{background:#e4f4df}
html.hc .floor{background:#fff}
.floor-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lvl{font-family:var(--display);background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-size:1.05rem;white-space:nowrap}
.lvl small{font-family:var(--body);font-weight:700;color:var(--sponge);margin-left:6px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.ican{flex:1;min-width:260px;font-size:.98rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mcard{max-width:470px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 var(--ink);transition:transform .15s,box-shadow .15s;position:relative}
.mcard:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 10px 0 var(--ink)}
.mcard .art{height:104px;border-radius:14px;background:var(--sky);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mcard .art :is(svg,img){height:96px;width:auto}
.mcard:hover .art :is(svg,img){animation:wig .6s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) scale(1.08)}65%{transform:rotate(7deg) scale(1.08)}}
.mcard h3{font-size:1.25rem}
.mcard p{font-size:.88rem;color:var(--ink2)}
.stars{display:flex;gap:3px} .stars svg{width:22px;height:22px}
.mcard .done{position:absolute;top:-10px;right:-8px;background:var(--good);color:#fff;border-radius:99px;font-size:.75rem;font-weight:700;padding:4px 10px;border:3px solid var(--ink);transform:rotate(6deg)}
.mcard .kind{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--carolina)}

/* ---------- mission stage ---------- */
.mhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mhead h1{font-size:1.8rem;flex:1;min-width:200px}
.pnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pcount{font-weight:700;font-size:.9rem;white-space:nowrap}
.dots{display:flex;gap:6px} .dots i{width:26px;height:10px;border-radius:9px;background:var(--line)} .dots i.on{background:var(--carolina)} .dots i.now{background:var(--sponge);outline:2px solid var(--ink)}
.score{font-family:var(--display);background:var(--ink);color:var(--sponge);border-radius:12px;padding:6px 14px}
#stage{min-height:420px}
.brief{background:var(--ink);color:#fff;border-radius:20px;padding:16px 20px;margin-bottom:16px;display:flex;gap:16px;align-items:center}
.brief h2{font-size:1.35rem;color:var(--sponge);margin-bottom:4px}
.brief p{max-width:72ch}
.brief .who{flex:none;width:92px} .brief .who :is(svg,img){width:92px;height:92px;object-fit:contain;animation:bob 2.6s ease-in-out infinite}
.brief .txt{flex:1}
.listen{display:none;background:#1e3a5c;color:#fff;border:2px solid var(--sky);border-radius:10px;padding:6px 10px;font-size:.85rem;flex:none}
html.read .listen{display:inline-flex;gap:6px;align-items:center}
.fb{margin-top:12px;border-radius:14px;padding:10px 16px;font-weight:700;min-height:46px;display:flex;align-items:center;gap:10px}
.fb.ok{background:var(--goodbg);color:var(--good);border:2px solid var(--good)}
.fb.no{background:var(--badbg);color:var(--bad);border:2px solid var(--bad)}
.fb svg{width:24px;height:24px;flex:none}
.donebar{margin-top:16px;background:var(--goodbg);border:3px solid var(--good);border-radius:20px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.donebar p{flex:1;min-width:220px;font-weight:700;color:#155c33}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.shake{animation:shake .4s} @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* chips / bins / cloze / order */
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:54px;padding:10px;border:3px dashed var(--line);border-radius:18px;background:#fff}
.chip{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:0 4px 0 var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:8px;text-align:left;max-width:300px;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip :is(svg,img){width:50px;height:50px;flex:none;object-fit:contain}
.chip.sel{background:var(--sponge);transform:translateY(-4px) rotate(-2deg)}
.chip.ok{background:var(--goodbg);border-color:var(--good);box-shadow:none;cursor:default;animation:pop .3s}
.chip.small{font-size:.85rem;padding:5px 10px;box-shadow:none;border-width:2px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.bin{border:3px solid var(--ink);border-radius:20px;background:var(--sky);padding:12px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s,background .2s}
.bin:hover,.bin.over{transform:scale(1.02);background:#fff3c4}
.bin strong{font-family:var(--display);font-weight:400;font-size:1.1rem;text-align:center}
html.dys .bin strong{font-weight:700}
.bin small{font-size:.8rem;color:var(--ink2);text-align:center}
.bin-art :is(svg,img){height:74px;width:auto;max-width:100%}
.bin-art img{height:118px}
.bin-art svg[role=img]{height:136px}
.bin-in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin.sponge{background:#fff1b8} .bin.broom{background:#ffdcc4}
.hint{font-size:.88rem;color:var(--ink2);text-align:center;margin:8px 0}
.cloze{font-size:1.2rem;line-height:2.5;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px 22px;margin-bottom:14px}
.blank{display:inline-block;min-width:130px;border:0;border-bottom:4px solid var(--carolina);background:#e9f4fc;border-radius:8px 8px 0 0;padding:0 10px;font-weight:700;color:#1b5e8f;line-height:1.7;text-align:center}
.blank.now{background:var(--sponge);border-color:var(--ink)} .blank.ok{background:var(--goodbg);border-color:var(--good);color:var(--good)}
.chain{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:58px;border:3px dashed var(--line);border-radius:18px;padding:10px;background:#fff}
.chain li{background:var(--goodbg);border:3px solid var(--good);border-radius:14px;padding:8px 12px;font-weight:700;animation:pop .3s;max-width:260px}
.chain li+li::before{content:"";display:inline-block;width:0;height:0;border:8px solid transparent;border-left-color:var(--good);margin-right:6px;vertical-align:middle}
.chain:empty::after{content:"Tap the step that happens first";color:var(--ink2);font-style:italic}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.opt{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;text-align:left;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.opt:hover{background:#fff8dc} .opt.ok{background:var(--goodbg);border-color:var(--good);box-shadow:none} .opt.no{background:var(--badbg);border-color:var(--bad);opacity:.6;box-shadow:none}
.q{font-size:1.15rem;font-weight:700;margin-top:6px}

/* result */
.result{text-align:center;padding:30px 20px}
.result h2{font-size:2.6rem;margin:10px 0}
.result .stars{justify-content:center} .result .stars svg{width:70px;height:70px;animation:pop .5s backwards}
.result .stars svg:nth-child(2){animation-delay:.2s}.result .stars svg:nth-child(3){animation-delay:.4s}
.cheer{display:flex;justify-content:center;gap:10px;margin-bottom:6px}.cheer img{height:150px;width:auto;animation:bob 1.2s ease-in-out infinite}.cheer img:last-child{animation-delay:-.6s}
.result .big{font-family:var(--display);font-size:1.4rem;margin:8px 0 18px}

/* accessibility drawer */
#a11y{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;background:#fff;z-index:60;border-left:4px solid var(--ink);padding:20px;transform:translateX(105%);transition:transform .25s;overflow:auto}
#a11y.on{transform:none}
#a11y h2{font-size:1.5rem;margin-bottom:12px}
.tog{display:flex;align-items:center;gap:12px;width:100%;background:#f1f7fc;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;text-align:left}
.tog i{flex:none;width:46px;height:26px;border-radius:20px;background:#9bb1c7;position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tog[aria-pressed=true] i{background:var(--good)} .tog[aria-pressed=true] i::after{left:23px}
.tog b{display:block}.tog small{color:var(--ink2);font-size:.82rem}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}

/* ---------- mission-specific ---------- */
/* M1 conveyor */
.belt{position:relative;background:linear-gradient(#dff0fb,#cfe6f6);border:3px solid var(--ink);border-radius:20px;overflow:hidden;padding:46px 10px 6px}
.rig{position:relative;width:min(100%,600px);margin:0 auto}
.rig .mach{display:block;width:100%;height:auto}
.rig .mach.chomp{animation:chomp .25s 4}
@keyframes chomp{50%{transform:scaleY(.9) scaleX(1.06)}}
.belt .item{position:absolute;top:calc(64% - 62px);left:3%;width:64px;height:64px;z-index:2;transition:left 1s ease-in,transform 1s ease-in,opacity .35s .65s}
.belt .item :is(svg,img){width:64px;height:64px;object-fit:contain}
.belt .item.in{left:calc(51% - 32px);transform:scale(.4);opacity:0}
.belt .item.out{left:86%;transform:none;opacity:1;z-index:4;transition:left 1s ease-out,transform .6s,opacity .3s}
.belt .cal{position:absolute;right:14px;top:10px;background:var(--ink);color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;z-index:5}
.belt .cal b{color:var(--sponge);font-family:var(--display);font-weight:400;font-size:1.2rem}
.belt .lbl{position:absolute;left:14px;top:10px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 12px;font-weight:700;z-index:5}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--sponge);z-index:6;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.floatup{position:absolute;z-index:7;font-family:var(--display);font-size:1.5rem;animation:floatup 1.2s ease-out forwards;pointer-events:none;text-shadow:0 2px 0 #fff}
@keyframes floatup{to{transform:translateY(-70px);opacity:0}}
/* M2 structures */
.mol{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px;text-align:center}
.mol svg{width:100%;height:150px}
.bead{animation:bead 2.4s ease-in-out infinite} @keyframes bead{50%{transform:translateY(-2.5px)}}
.stampd{font-family:var(--display);border:4px solid;border-radius:10px;padding:3px 10px;display:inline-block;transform:rotate(-6deg);animation:pop .3s;margin-top:6px}
.stampd.y{color:var(--good)} .stampd.n{color:var(--bad)}
/* M3 hexes */
.lab{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.hexrow{display:flex;align-items:center;justify-content:center;gap:0;min-height:150px;flex-wrap:nowrap}
.hex{width:92px;height:82px;flex:none;position:relative;transition:margin .7s,transform .7s}
.hex::before{content:"";position:absolute;inset:0;background:var(--carolina);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex::after{content:"glucose";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.78rem}

.hex.b::before{background:#e8693a}.hex.b.inv::before{background:#b9471d;transform:scaleY(-1)}

/* glucose bead chains for the polysaccharide diagrams */
function beads(pts,links,col='#f0803c'){let s='';links.forEach(([a,b])=>s+=`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="#12263f" stroke-width="2.5"/>`);pts.forEach((p,i)=>s+=`<circle class="bead" style="animation-delay:${-(i%7)*.3}s" cx="${p[0]}" cy="${p[1]}" r="5.6" fill="${col}" stroke="#12263f" stroke-width="2"/>`);return s}
function molSVG(kind){let pts=[],links=[];const add=(x,y,from)=>{pts.push([+x.toFixed(1),+y.toFixed(1)]);if(from!=null)links.push([from,pts.length-1]);return pts.length-1};
  if(kind==='cellulose'){for(let r=0;r<4;r++){let prev=null;for(let c=0;c<13;c++)prev=add(22+c*13,36+r*26,prev)}for(let r=0;r<3;r++)for(let c=1;c<13;c+=3)links.push([r*13+c,(r+1)*13+c]);}
  else if(kind==='amylose'){let prev=null;for(let i=0;i<44;i++){const th=i*.55;prev=add(22+th*6.2-17*Math.sin(th),75-30*Math.cos(th),prev)}}
  else{const grow=(from,x,y,ang,n,depth,o)=>{let prev=from;for(let i=0;i<n;i++){x+=Math.cos(ang)*o.step;y+=Math.sin(ang)*o.step;prev=add(x,y,prev);if(depth>0&&i%o.every===1)grow(prev,x,y,ang+(Math.floor(i/o.every)%2?1:-1)*o.spread,o.bn,depth-1,o)}};
    if(kind==='glycogen'){const c=add(100,75,null);for(let k=0;k<5;k++)grow(c,100,75,k*Math.PI*2/5+.3,4,2,{step:9.5,every:2,spread:1,bn:3})}else{const c=add(14,84,null);grow(c,14,84,-.05,14,1,{step:12,every:4,spread:.85,bn:4})}}
  const lab={cellulose:'Straight chains stacked in rigid rows',amylose:'One coiled chain',glycogen:'Dense bush with many branches',amylopectin:'A chain with a few branches'}[kind];
  return `<svg viewBox="0 0 200 150" role="img" aria-label="${lab}">${beads(pts,links,kind==='cellulose'?'#4f9e45':kind==='glycogen'?'#c7577f':'#f0803c')}</svg>`}

/* each part keeps its own tally, so going back and replaying a part never double-counts; the better run of a part is the one that is kept */
function renderStep(){if(game.stop){game.stop();game.stop=null}cur.live={s:0,t:0,b:0};const tok=++cur.tok,k=cur.step;mhead();const st=$('#stage');st.innerHTML='';window.scrollTo(0,0);

const LV=[[1,'Level 1 · Emerging','I can describe what fiber is, and explain how it is different from other types of polysaccharides such as starch or glycogen.'],[2,'Level 2 · Proficient','Additionally, I can differentiate between soluble and insoluble fiber.'],[3,'Level 3 · Advanced','Additionally, I can describe the benefits of dietary fiber as I explain their role in maintaining proper health.']];
function levelStatus(l){const ms=M.filter(m=>m.level===l),d=ms.map(m=>S.m[m.id]).filter(Boolean);if(!d.length)return['z','Not started',0];const avg=Math.round(d.reduce((a,x)=>a+x.pct,0)/d.length);return d.length===ms.length&&avg>=80?['y','Demonstrated',avg]:['n',d.length<ms.length?`In progress (${d.length} of ${ms.length} jobs)`:'Keep practicing',avg]}
function insights(){const st=[],fo=[];Object.keys(TOPICS).forEach(t=>{const v=S.topics[t];if(!v||v[1]<3)return;const p=v[0]/v[1];if(p>=.85)st.push([t,p]);else if(p<.7)fo.push([t,p])});st.sort((a,b)=>b[1]-a[1]);fo.sort((a,b)=>a[1]-b[1]);const f=a=>a.slice(0,6).map(x=>`${x[0]} (Level ${TOPICS[x[0]]})`);return{st:f(st),fo:f(fo)}}
function wrap(c,text,x,y,maxW,lh,maxLines=99){const words=String(text).split(/\s+/);let line='',n=0;for(const wd of words){const t=line?line+' '+wd:wd;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,y);y+=lh;n++;line=wd;if(n>=maxLines-1){while(c.measureText(line+'…').width>maxW)line=line.slice(0,-1)}}else line=t}if(line){c.fillText(line,x,y);y+=lh}return y}
function drawEvidence(){const cv=$('#evc'),c=cv.getContext('2d'),W=1000,H=1300,ink='#12263f';c.fillStyle='#fff';c.fillRect(0,0,W,H);c.fillStyle=ink;c.fillRect(0,0,W,150);c.fillStyle='#f7c531';c.fillRect(0,150,W,10);
  c.fillStyle='#fff';c.font='400 54px \"Titan One\",\"Arial Black\",'+CF;c.fillText('Mission: Indigestible',40,72);c.font='700 22px '+CF;c.fillStyle='#bfe1f7';c.fillText('MISSION DEBRIEF  ·  Food & Exercise Science  ·  Standard 3.5 Dietary Fiber',40,112);
  const r=rank();c.textAlign='right';c.fillStyle='#f7c531';c.font='400 30px \"Titan One\",\"Arial Black\",'+CF;c.fillText(r.name,W-40,66);c.fillStyle='#fff';c.font='700 20px '+CF;c.fillText(shine()+' shine',W-40,98);c.textAlign='left';
  c.fillStyle=ink;c.font='700 34px '+CF;c.fillText(S.name||'Recruit',40,212);c.font='20px '+CF;c.fillStyle='#3d5370';c.fillText('Completed '+new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),40,244);
  c.font='italic 19px '+CF;let y=wrap(c,'“I can differentiate between soluble and insoluble fiber, and explain their role in maintaining proper health.”',40,280,920,26)+14;
  LV.forEach(l=>{const st=levelStatus(l[0]),col=st[0]==='y'?'#1f8a4c':st[0]==='n'?'#a87400':'#7c8ea3';c.fillStyle='#eef6fc';c.fillRect(40,y,920,44);c.fillStyle=ink;c.font='700 23px '+CF;c.fillText(l[1],54,y+30);c.textAlign='right';c.fillStyle=col;c.fillText(st[1]+(st[2]?'  ·  '+st[2]+'%':''),946,y+30);c.textAlign='left';y+=68;
    c.fillStyle='#3d5370';c.font='17px '+CF;y=wrap(c,l[2],54,y,890,23)+6;
    M.filter(m=>m.level===l[0]).forEach(m=>{const d=S.m[m.id];c.fillStyle=ink;c.font='700 19px '+CF;c.fillText(m.title,70,y+6);c.font='19px '+CF;c.fillStyle=d?ink:'#7c8ea3';c.textAlign='right';c.fillText(d?`best ${d.pct}%   ${'★'.repeat(d.stars)}${'☆'.repeat(3-d.stars)}   ${d.plays} play${d.plays===1?'':'s'}`:'not played yet',946,y+6);c.textAlign='left';y+=30});y+=14});
  const sm=S.m.smarty;c.fillStyle='#e4f4df';c.fillRect(40,y,920,44);c.fillStyle=ink;c.font='700 21px '+CF;c.fillText('Final review · Smarty Plants',54,y+29);c.textAlign='right';c.fillText(sm?`best ${sm.pct}%   ${'★'.repeat(sm.stars)}${'☆'.repeat(3-sm.stars)}`:'not played yet',946,y+29);c.textAlign='left';y+=74;
  const {st,fo}=insights();const col=(title,list,empty,x,color)=>{c.fillStyle=color;c.font='700 21px '+CF;c.fillText(title,x,y);let yy=y+30;c.fillStyle=ink;c.font='18px '+CF;if(!list.length){c.fillStyle='#3d5370';yy=wrap(c,empty,x,yy,430,24)}list.forEach(t=>{c.fillText('•  '+t,x,yy);yy+=26});return yy};
  const y1=col('Big strengths',st,'Play more jobs to reveal your strengths.',40,'#1f8a4c'),y2=col('Focus on these first while studying',fo,st.length?'No weak spots found yet. Keep it up!':'Play more jobs to find out what to study.',520,'#c2571a');y=Math.max(y1,y2)+16;
  if(S.reflect&&S.reflect.trim()&&y<H-120){c.fillStyle=ink;c.font='700 21px '+CF;c.fillText('My reflection',40,y);c.font='18px '+CF;c.fillStyle='#3d5370';wrap(c,S.reflect.trim(),40,y+28,920,24,Math.max(1,Math.floor((H-70-y-28)/24)))}
  c.fillStyle='#eef6fc';c.fillRect(0,H-44,W,44);c.fillStyle='#3d5370';c.font='15px '+CF;c.fillText('Scores show each job’s best run and the share of answers that were right on the first try.',40,H-17)}
function pdfBlob(cv){const jpg=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),W=612,H=792,ih=752,iw=+(ih*cv.width/cv.height).toFixed(1),x=+((W-iw)/2).toFixed(1),parts=[],offs=[];let len=0;const add=s=>{parts.push(s);len+=s.length};
  add('%PDF-1.4\n');const obj=s=>{offs.push(len);add(`${offs.length} 0 obj\n${s}\nendobj\n`)};const cs=`q ${iw} 0 0 ${ih} ${x} 20 cm /Im0 Do Q`;
  obj('<</Type/Catalog/Pages 2 0 R>>');obj('<</Type/Pages/Kids[3 0 R]/Count 1>>');obj(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im0 5 0 R>>>>/Contents 4 0 R>>`);obj(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  obj(`<</Type/XObject/Subtype/Image/Width ${cv.width}/Height ${cv.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n${jpg}\nendstream`);
  const xr=len;add(`xref\n0 6\n0000000000 65535 f \n${offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  const s=parts.join(''),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return new Blob([u],{type:'application/pdf'})}
async function saveFile(name,blob){const note=$('#dlnote');try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data:blob});note.textContent='Saved. Turn it in or add it to your portfolio.';return}}}catch(e){if(e&&e.code==='declined'){note.textContent='Download canceled.';return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);note.textContent='Check your Downloads folder for '+name+'.'}catch(e){note.textContent='The download was blocked here. Take a screenshot of the debrief instead.'}}
function debrief(){hud();const fn=(S.name||'recruit').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')||'recruit',played=Object.keys(S.m).length;
  $('#debrief').innerHTML=`<div class="mhead"><button class="btn ghost sm" id="dback">Back to HQ</button><h1>Mission Debrief</h1></div><div class="evi"><div><canvas id="evc" width="1000" height="1300" role="img" aria-label="Your mission debrief: levels, best scores, strengths and focus areas"></canvas></div>
   <div><div class="panel"><h2 style="font-size:1.4rem;margin-bottom:8px">Your evidence of learning</h2><p>${played?`You have finished ${played} of ${M.length} jobs.`:'You have not finished a job yet. Play at least one, then come back.'} This page updates every time you improve a score.</p>
   ${LV.map(l=>{const s=levelStatus(l[0]);return `<div class="lvlrow"><b>${l[1]}</b><span class="tagp ${s[0]}">${s[1]}</span></div>`}).join('')}
   <label for="refl" style="display:block;font-weight:700;margin:14px 0 6px">Optional reflection for your portfolio</label><p class="note" style="margin-bottom:6px">How does this debrief show you are a Self-Directed Learner? What will you study next, and how?</p><textarea id="refl" maxlength="600">${esc(S.reflect||'')}</textarea>
   <div class="center" style="margin-top:14px;justify-content:flex-start"><button class="btn" id="dpng">Download picture (PNG)</button><button class="btn yellow" id="dpdf">Download PDF</button></div><p class="note" id="dlnote" role="status" style="margin-top:8px;min-height:1.5em"></p></div>
   <div class="panel" style="margin-top:14px"><h3 style="font-size:1.1rem;margin-bottom:6px">Start over</h3><p class="note">Clears the name, stars and shine saved on this device.</p><div class="center" style="justify-content:flex-start;margin-top:8px"><button class="btn ghost sm" id="reset">Clear my progress</button><button class="btn sm orange" id="reset2" hidden>Yes, erase everything</button></div></div></div></div>`;
  show('debrief');const paint=()=>drawEvidence();paint();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(paint);
  $('#dback').onclick=hq;$('#refl').oninput=e=>{S.reflect=e.target.value;save();paint()};
  $('#dpng').onclick=()=>$('#evc').toBlob(b=>saveFile(`fiber-mission-debrief-${fn}.png`,b),'image/png');$('#dpdf').onclick=()=>saveFile(`fiber-mission-debrief-${fn}.pdf`,pdfBlob($('#evc')));
  $('#reset').onclick=()=>{$('#reset2').hidden=false;$('#reset2').focus()};$('#reset2').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S={name:'',m:{},topics:{},reflect:'',set:S.set};save();welcome();show('welcome')}}

/* ---------- boot ---------- */
function start(){buildA11y();applySet();$('#homeBtn').onclick=()=>S.name?hq():show('welcome');$('#a11yBtn').onclick=()=>toggleA11y();$('#snd').onclick=()=>{S.set.sound=!S.set.sound;applySet();sfx.ok()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#a11y').classList.contains('on'))toggleA11y(false)});welcome();if(S.name)hq();else show('welcome')}
start();


</script>
